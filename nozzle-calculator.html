<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор выбора сопла</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body { background-color:#0b0f19; color:#f3f4f6; font-family:'Plus Jakarta Sans',sans-serif; }
input[type=range]::-webkit-slider-thumb {
  width:32px;height:32px;appearance:none;
  background:#10b981;border-radius:50%;
  cursor:pointer;border:4px solid #fff;
}
.unit-muted {opacity:.7;font-weight:400;font-size:.875rem;}
</style>
</head>

<body class="min-h-screen py-8">

<!-- КНОПКА НАЗАД -->
<div class="fixed top-4 left-4 lg:top-6 lg:left-6 z-50">
  <a href="index.html"
     class="flex items-center gap-2
            bg-[#161d30] border-2 border-[#2f3b63]
            text-gray-200
            px-3 py-1.5 lg:px-5 lg:py-2.5
            rounded-lg lg:rounded-xl
            text-xs lg:text-sm
            font-semibold
            hover:bg-[#1d2742]
            hover:border-emerald-500/60
            transition">
      ← На главную
  </a>
</div>

<!-- МОБИЛЬНАЯ ВСПЛЫВАЮЩАЯ ПОЛОСА -->
<div id="mobile-bar"
     class="fixed top-0 left-0 right-0
            bg-[#161d30] border-b border-[#24304f]
            px-4 py-3
            flex justify-between items-center
            transform -translate-y-full
            transition-transform duration-300
            lg:hidden z-40">

  <span class="text-sm text-gray-400">Диаметр сопла</span>
  <span id="mobile-diameter" class="text-lg font-bold text-emerald-500">
    0,40 мм
  </span>
</div>

<header class="max-w-7xl mx-auto px-4 mb-8">
  <h1 class="text-3xl font-bold text-center text-white">
    Калькулятор выбора сопла
  </h1>
</header>

<main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">

<!-- ЛЕВЫЙ БЛОК -->
<section class="order-2 lg:order-1 lg:col-span-5 bg-white p-6 rounded-2xl shadow-md text-[#3a3a4a] space-y-4">
<h3 class="text-lg font-bold border-b pb-3 mb-4">Входные данные</h3>
<div id="input-fields" class="space-y-4">
<!-- твои инпуты без изменений -->
</div>
</section>

<!-- ПРАВЫЙ БЛОК -->
<section class="order-1 lg:order-2 lg:col-span-7 space-y-6">

<div id="result-card" class="bg-[#161d30] p-8 rounded-2xl border border-[#24304f]">

<div id="diameter-block"
     class="text-center mb-8 bg-[#0b0f19] p-4 rounded-xl border border-[#24304f]">

<div class="text-sm text-gray-400 mb-1">Диаметр сопла</div>
<div id="res-diameter"
     class="text-5xl font-bold text-emerald-500">
  0,40 мм
</div>

</div>

</div>

</section>
</main>

<script>
/* ===== ВСПЛЫВАЮЩАЯ МОБИЛЬНАЯ ПАНЕЛЬ ===== */

const mobileBar = document.getElementById('mobile-bar');
const diameterBlock = document.getElementById('diameter-block');
const mobileDiameter = document.getElementById('mobile-diameter');
const resDiameter = document.getElementById('res-diameter');

function handleScroll() {
  if (window.innerWidth >= 1024) return;

  const rect = diameterBlock.getBoundingClientRect();

  if (rect.bottom < 0) {
    mobileBar.classList.remove('-translate-y-full');
  } else {
    mobileBar.classList.add('-translate-y-full');
  }
}

window.addEventListener('scroll', handleScroll);

/* ===== ОБНОВЛЕНИЕ ДИАМЕТРА В МОБИЛЬНОЙ ПОЛОСЕ ===== */

const observer = new MutationObserver(() => {
  mobileDiameter.textContent = resDiameter.textContent;
});

observer.observe(resDiameter, { childList:true });

</script>

</body>
</html>
